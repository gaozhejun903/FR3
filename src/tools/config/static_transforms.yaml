  # AI-kimi: ========== 新增标定结果 ==========
  # AI-kimi: 数据来源: calibration_data/combined_calibration.json -> hand_eye_calibration -> ltcp_to_camera
  # AI-kimi: 描述: 左臂TCP (Ltcp) 到相机 (camera_link) 的手眼标定变换
  - frames:
      parent: Ltcp
      child: camera_link
    # AI-kimi: 位置参数 (单位: 米)
    translation:
      x: 0.011550205535439057
      y: -0.08829998528743548
      z: -0.08037542431989243
    # AI-Deep修改: yaw取反(90°→-90°)配合代码Z取反，保持camera+Y→TCP+X不变
    # camera+X→TCP-Y ✓, camera+Y→TCP+X ✓, camera+Z→TCP-Z ✓(代码取反)
    # 旋转参数 (单位: 度，使用RPY欧拉角 XYZ顺序)
    rotation:
      roll: -0.8156816220768173
      pitch: -0.7108002290829644
      yaw: -89.99182846092766
